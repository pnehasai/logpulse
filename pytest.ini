[pytest]
; Without this, pytest-asyncio gives every async test its own fresh event
; loop. That breaks anything that reuses a shared, module-level async
; client across multiple tests (like app.py's REDIS_CLIENT, created once
; at import time) -- the client's connection gets tied to whichever loop
; existed when it was first used, and a later test's new loop can't use it.
; Sharing one event loop for the whole session fixes that.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
